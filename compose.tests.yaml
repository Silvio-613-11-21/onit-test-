# Запуск: docker compose -f compose.tests.yaml up --build --exit-code-from backend
# Тесты удаляют схемы БД, поэтому используют только отдельную временную базу.
name: onit-tests

services:
  backend:
    build: .
    command: npm test
    environment:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://test_user:test_password@test-db:5432/onit_test
    depends_on:
      test-db:
        condition: service_healthy

  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: onit_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
